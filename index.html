<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="src/assets/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>TecMI Vyapti - POS Checkout</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F1F5F9; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;">
      <div style="width: 40px; height: 40px; border: 3px solid #E2E8F0; border-top-color: #2F80ED; border-radius: 50%; animation: initial-spin 0.8s linear infinite;"></div>
      <p style="margin: 14px 0 0 0; font-size: 14px; font-weight: 600; color: #334155; letter-spacing: 0.025em; font-family: inherit;">Loading POS Terminal...</p>
      <style>
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
